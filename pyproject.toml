[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regression_monkey"
version = "0.2.1"
description = "Reproducible regression workflow: loaders → dependency tracking → codegen → execution."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.14"
license = {file = "LICENSE"}
authors = [{name="Your Name", email="you@example.com"}]
keywords = ["econometrics","regression","reproducibility","rpy2","jinja2","arcticdb","textual"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis"
]

dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "jinja2>=3.1",
  "pyarrow>=14.0",
  "openpyxl>=3.1",
  "arcticdb>=6.2.3",
  "textual>=0.52",
  "rich>=13.7",
  # rpy2 remains optional on Windows environments where R is unavailable.
  "rpy2>=3.5; platform_system != 'Windows'"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black>=24.4",
  "ruff>=0.5",
  "build>=1.2.1",
  "twine>=5.0"
]

[project.urls]
Homepage = "https://example.com/regmonkey"
Repository = "https://example.com/regmonkey"
Issues = "https://example.com/regmonkey/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reg_monkey = ["*.jinja"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
